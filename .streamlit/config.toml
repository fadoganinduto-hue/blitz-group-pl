# Blitz financial intelligence theme — one accessible, brand-consistent light mode.

[theme]
base = "light"
primaryColor = "#018EDD"
backgroundColor = "#F8F8F8"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#FCFCFC"
textColor = "#1A1A1A"
linkColor = "#018EDD"
codeTextColor = "#4D4D4D"
borderColor = "#E2E2E2"
dataframeBorderColor = "#E2E2E2"
dataframeHeaderBackgroundColor = "#D6F6FF"

showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Status colours are reserved for risk and exception states.
greenColor = "#1A7F37"
redColor = "#CF222E"
yellowColor = "#BF8700"
blueColor = "#00B9F2"
grayColor = "#4D4D4D"

# Categorical series stay readable on white; lighter brand tones are for surfaces.
chartCategoricalColors = ["#00B9F2", "#018EDD", "#004EA9", "#1A1A1A", "#4D4D4D"]
chartSequentialColors = [
    "#D6F6FF", "#D6F6FF", "#B2EDFF", "#B2EDFF", "#B2EDFF",
    "#00B9F2", "#00B9F2", "#018EDD", "#018EDD", "#004EA9",
]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FCFCFC"
codeBackgroundColor = "#FCFCFC"
textColor = "#1A1A1A"
borderColor = "#E2E2E2"
primaryColor = "#018EDD"
